[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "poremind"
version = "0.1.0"
description = "A Python framework for single-molecule nanopore signal analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
keywords = ["nanopore", "single-molecule", "signal-analysis", "event-detection", "bioinformatics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "scipy",
  "matplotlib>=3.9",
  "ruptures",
  "hmmlearn",
  "gradio",
]

[project.optional-dependencies]
abf = ["pyabf"]
dl = ["torch", "tqdm"]
explain = ["torch", "captum", "tqdm"]
umap = ["umap-learn"]
xgboost = ["xgboost"]
all = ["pyabf", "torch", "captum", "tqdm", "umap-learn", "xgboost"]

[project.urls]
Homepage = "https://LuChenLab.github.io/PoreMind/"
Documentation = "https://LuChenLab.github.io/PoreMind/"
Repository = "https://github.com/LuChenLab/PoreMind"
Issues = "https://github.com/LuChenLab/PoreMind/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ui = ["assets/*.png"]
agent_skill = ["**/*.md", "**/*.json", "**/*.mdc", "**/*.py"]


[project.scripts]
poremind-ui = "ui.app:main"
